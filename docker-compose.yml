services:
  broker:
    image: confluentinc/cp-kafka:7.9.0
    hostname: broker
    container_name: ridestream-broker
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Schema Registry is wired for Phase 2; safe to leave running unused in Phase 1.
  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.0
    hostname: schema-registry
    container_name: ridestream-schema-registry
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: ridestream-kafka-ui
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ridestream
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  # Creates gps-events, gps-events-rider, eta-updates, and driver-anomalies once the broker is healthy.
  init-topics:
    image: confluentinc/cp-kafka:7.9.0
    container_name: ridestream-init-topics
    depends_on:
      broker:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        kafka-topics --bootstrap-server broker:29092 --create --if-not-exists \
          --topic gps-events \
          --partitions 6 \
          --replication-factor 1 \
          --config retention.ms=86400000
        kafka-topics --bootstrap-server broker:29092 --create --if-not-exists \
          --topic gps-events-rider \
          --partitions 6 \
          --replication-factor 1 \
          --config retention.ms=86400000
        kafka-topics --bootstrap-server broker:29092 --create --if-not-exists \
          --topic eta-updates \
          --partitions 6 \
          --replication-factor 1 \
          --config retention.ms=86400000
        kafka-topics --bootstrap-server broker:29092 --create --if-not-exists \
          --topic driver-anomalies \
          --partitions 6 \
          --replication-factor 1 \
          --config retention.ms=86400000
        kafka-topics --bootstrap-server broker:29092 --create --if-not-exists \
          --topic driver-anomaly-windows \
          --partitions 6 \
          --replication-factor 1 \
          --config retention.ms=86400000
        kafka-topics --bootstrap-server broker:29092 --create --if-not-exists \
          --topic driver-anomaly-windows-hop \
          --partitions 6 \
          --replication-factor 1 \
          --config retention.ms=86400000
        kafka-topics --bootstrap-server broker:29092 --create --if-not-exists \
          --topic driver-anomalies-teleport \
          --partitions 6 \
          --replication-factor 1 \
          --config retention.ms=86400000
        kafka-topics --bootstrap-server broker:29092 --create --if-not-exists \
          --topic driver-anomalies-freeze \
          --partitions 6 \
          --replication-factor 1 \
          --config retention.ms=86400000
        kafka-topics --bootstrap-server broker:29092 --list
        echo "Topics ready."
    restart: "no"

  # Phase 4 Step 1 — ksqlDB server (SQL stream processing). No anomaly queries yet.
  ksqldb-server:
    image: confluentinc/cp-ksqldb-server:7.9.0
    hostname: ksqldb-server
    container_name: ridestream-ksqldb-server
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_started
    ports:
      - "8088:8088"
    environment:
      KSQL_CONFIG_DIR: /etc/ksql
      KSQL_BOOTSTRAP_SERVERS: broker:29092
      KSQL_HOST_NAME: ksqldb-server
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_CACHE_MAX_BYTES_BUFFERING: 0
      KSQL_KSQL_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_REPLICATION_FACTOR: 1
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE: "true"
      KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: "true"
      # Single-broker local cluster
      KSQL_KSQL_SINK_REPLICAS: 1
      KSQL_KSQL_STREAMS_REPLICATION_FACTOR: 1
      KSQL_KSQL_INTERNAL_TOPIC_REPLICAS: 1
      # Phase 4 Step 6 — EOS for persistent queries (read → process → write)
      KSQL_KSQL_STREAMS_PROCESSING_GUARANTEE: exactly_once_v2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/info"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 40s

  ksqldb-cli:
    image: confluentinc/cp-ksqldb-cli:7.9.0
    container_name: ridestream-ksqldb-cli
    depends_on:
      ksqldb-server:
        condition: service_healthy
    entrypoint: /bin/sh
    tty: true
    volumes:
      - ./ksql:/ksql

  # Phase 5 — Observability (no Nest code: scrape Kafka metrics → Prometheus → Grafana)
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: ridestream-kafka-exporter
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "9308:9308"
    command:
      - --kafka.server=broker:29092
      - --web.listen-address=:9308

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ridestream-prometheus
    depends_on:
      - kafka-exporter
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ridestream-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  # Phase 7 — Redis GEO + Pub/Sub for live nearby riders
  redis:
    image: redis:7.4-alpine
    container_name: ridestream-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-insight:
    image: redis/redisinsight:2.70
    container_name: ridestream-redis-insight
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5540:5540"
    environment:
      # Insight runs in Docker — use the Compose service name, not 127.0.0.1
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: ridestream-redis
    volumes:
      - redis-insight-data:/data

volumes:
  redis-insight-data:
